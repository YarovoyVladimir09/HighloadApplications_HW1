name: practice1-grafana-prometheus

x-app: &app
  image: localhost/practice1-grafana-prometheus-app:1.0
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 15s
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s
  environment: &app-env
    # Required by the pinned amd64 image under QEMU on Apple Silicon.
    QEMU_GUEST_BASE: '0x800000000000'
    ENABLE_DEMO_FAULTS: ${ENABLE_DEMO_FAULTS:-1}
    DEMO_DELAY_MS: ${DEMO_DELAY_MS:-5}

services:
  app-1:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-1
      DATACENTER: dc-1
    ports:
      - '127.0.0.1:${APP1_PORT:-18081}:8080'

  app-2:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-2
      DATACENTER: dc-2
    ports:
      - '127.0.0.1:${APP2_PORT:-18082}:8080'
