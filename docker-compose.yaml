name: practice1-grafana-prometheus

x-app: &app
  image: localhost/practice1-grafana-prometheus-app:1.0
  platform: linux/amd64
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  stop_grace_period: 15s
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/health']
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s
  environment: &app-env
    # Required by the pinned amd64 image under QEMU on Apple Silicon.
    QEMU_GUEST_BASE: '0x800000000000'
    ENABLE_DEMO_FAULTS: ${ENABLE_DEMO_FAULTS:-1}
    DEMO_DELAY_MS: ${DEMO_DELAY_MS:-5}

services:
  app-1:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-1
      DATACENTER: dc-1
    ports:
      - '127.0.0.1:${APP1_PORT:-18081}:8080'

  app-2:
    <<: *app
    environment:
      <<: *app-env
      POD_ID: pod-2
      DATACENTER: dc-2
    ports:
      - '127.0.0.1:${APP2_PORT:-18082}:8080'

  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_PORT:-9090}:9090'
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s

  grafana:
    image: docker.io/grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3000}:3000'
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  prometheus-data:
  grafana-data:
